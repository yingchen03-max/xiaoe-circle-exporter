<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小鹅通助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="brand__icon" aria-hidden="true">鹅</span>
        <div>
          <h1>帖子打包器</h1>
          <p>正文、附件、完整评论一次下载</p>
        </div>
      </div>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <p id="status">正在识别当前页面…</p>
      </section>

      <section class="format-group" aria-label="导出格式">
        <button id="format-md" class="format-option" type="button" aria-pressed="false">
          <span class="format-option__name">Markdown（.md）</span>
          <span class="format-option__desc">仅正文与评论，单文件直接保存</span>
        </button>
        <button id="format-html" class="format-option format-option--active" type="button" aria-pressed="true">
          <span class="format-option__name">HTML 离线包（.zip）</span>
          <span class="format-option__desc">含附件、图片、音频和视频</span>
        </button>
      </section>

      <button id="export" type="button" disabled>打包当前帖子</button>
      <p id="hint" class="hint"></p>

      <footer>所有数据仅在本机处理，不会上传。</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
